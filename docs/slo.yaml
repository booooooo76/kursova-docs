# Специфікація рівня послуг Kursova PC Shop «як код» (Лаб.12, Завд.1).
# Читає tools/error_budget.py: бюджет помилок = (100 % - SLO) x вікно; SLA - зовнішня обіцянка, завжди нижча за SLO.
# Різниця SLA - SLO = буфер надійності команди: SLO порушується раніше, ніж клієнт отримує право на компенсацію.
service: kursova-pc-shop
owner: Загребенюк Б. (booooooo76)
review_date: 2027-02-25
window:
  type: rolling
  days: 30            # 30 x 24 x 60 = 43 200 хвилин
policy: docs/ops/slo-policy.md

slis:
  - id: SLI-1
    name: availability
    description: >-
      Частка хвилин за 30 днів, у яких синтетична перевірка GET /api/health з того ж хоста повернула HTTP 200
      (status ok: БД доступна, міграції застосовано). Хвилина без відповіді за 5 с або з 503 - погана.
    good_event: "GET /api/health -> 200 протягом 5 с"
    source: tools/ops_check.py (алерт A1), щохвилини
    slo: 99.5
    sla: 99.0
    rationale: >-
      Один екземпляр без резервування (ISD): планові перезапуски й відновлення за RB-001 (RTO 60 хв) мають
      вміститися в бюджет 216 хв. SLA 99.0 % = 432 хв лишає ще одне повне відновлення до виплати компенсації.

  - id: SLI-2
    name: latency
    description: >-
      Частка хвилин за 30 днів, у яких 95-й перцентиль часу відповіді GET /products (від приймання запиту до
      останнього байта, вимір k6 http_req_duration) менший за 300 мс.
    good_event: "p95(/products, вікно 1 хв) < 300 мс"
    source: k6 loadtest/products_slo.js (Лаб.2); у продакшні - журнал доступу werkzeug з часом відповіді
    threshold_ms: 300
    slo: 99.0
    sla: 98.0
    rationale: >-
      Лаб.2: базова лінія p95 93,9 мс (1 VU), 192,15 мс при 5 VU (PASS), 1,2 с при 50 VU (FAIL). Поріг 300 мс
      тримається в нормальному режимі з запасом; піки на кшталт 50 VU допустимі не довше 432 хв на місяць.

  - id: SLI-3
    name: supply-receipt-integrity
    description: >-
      Частка хвилин за 30 днів, протягом яких немає жодної частково застосованої операції «Прийняти поставку»
      (залишки товарів збільшено, а статус поставки не received, або залишки збільшено двічі для однієї поставки).
      Погана хвилина рахується від першого незавершеного запису до виправлення даних.
    good_event: "немає поставок у стані partially_applied / double_applied"
    source: >-
      до CAPA - лише ручна звірка залишків (сліпа зона, див. INC-001); після CAPA-1 - подія журналу
      delivery_receive_failed (алерт A5), а подвійне застосування неможливе конструктивно (транзакція + перевірка статусу)
    slo: 99.9
    sla: 99.5
    rationale: >-
      Цілісність обліку важливіша за доступність: помилкові залишки продають товар, якого немає. Бюджет 43,2 хв -
      час, за який черговий має виявити й виправити збій за RB-002, перш ніж продано товар зі зламаних залишків.

# Погані хвилини поточного вікна (заповнюються з Incident Report; посилання - джерело доказу)
spent:
  - sli: SLI-3
    minutes: 3.1
    ref: docs/incidents/INC-001.md (20:16:08 - 20:19:15 UTC, docs/incidents/data/INC-001_workaround.json)
